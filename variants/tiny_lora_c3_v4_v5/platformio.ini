[TinyLora_C3_V4_V5]
extends = esp32_base
board = esp32-c3-devkitm-1
platform_packages =
  platformio/framework-arduinoespressif32 @ https://github.com/ssp97/framework-arduinoespressif32-pm/archive/337773a50a90200c106f92b2f4bea56bb16126b1.zip
build_flags =
  ${esp32_base.build_flags}
  -I variants/tiny_lora_c3_v4_v5
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LORA_FREQ=480.375
  -D LORA_BW=125
  -D LORA_SF=11
  -D LORA_CR=5
  -D LORA_TX_POWER=1
  -D MAX_LORA_TX_POWER=22
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
  -D P_LORA_NSS=8
  -D P_LORA_RESET=5
  -D P_LORA_DIO_1=3
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=6
  -D P_LORA_MOSI=7
  -D SX126X_RXEN=2
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/tiny_lora_c3_v4_v5>
lib_deps = ${esp32_base.lib_deps}
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  densaugeo/base64 @ ~1.4.0



[env:TinyLora_C3_V4_V5_repeater]
extends = TinyLora_C3_V4_V5
build_flags =
  ${TinyLora_C3_V4_V5.build_flags}
  ;-D ARDUINO_USB_MODE=1
  ;-D ARDUINO_USB_CDC_ON_BOOT=1
  -D ADVERT_NAME='"TinyLora C3 V4/V5 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D TINYLORA_C3_REPEATER_IDLE_DELAY_MS=1
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${TinyLora_C3_V4_V5.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${TinyLora_C3_V4_V5.lib_deps}
  ${esp32_ota.lib_deps}



[env:TinyLora_C3_V4_V5_companion_radio_ble]
extends = TinyLora_C3_V4_V5
build_flags =
  ${TinyLora_C3_V4_V5.build_flags}
  -D TINYLORA_C3_COMPANION_IDLE_DELAY_MS=1
;  -D ARDUINO_USB_MODE=1
;  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D esp_ble_gap_ext_adv_reprot_t=esp_ble_gap_ext_adv_report_t
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${TinyLora_C3_V4_V5.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${TinyLora_C3_V4_V5.lib_deps}
  ${esp32_ota.lib_deps}
