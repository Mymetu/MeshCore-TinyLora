[TinyLora_MV_ZHCN]
extends = esp32_base
platform = platformio/espressif32@6.13.0
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 20000000L
board_build.arduino.memory_type = dio_qspi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
platform_packages =
  platformio/framework-arduinoespressif32 @ https://github.com/Mymetu/framework-arduinoespressif32-pm/archive/de4f22b.zip
build_flags =
  ${esp32_base.build_flags}
  -I variants/tiny_lora_mv_zhcn
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LORA_FREQ=480.375
  -D LORA_BW=125
  -D LORA_SF=11
  -D LORA_CR=5
  -D LORA_TX_POWER=1
  -D MAX_LORA_TX_POWER=22
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_BMP280_FORCED_MODE=1
  -D PIN_GPS_TX=21
  -D PIN_GPS_RX=20
  -D PIN_GPS_EN=12
  -D PIN_GPS_EN_ACTIVE=HIGH
  -D PIN_VBAT_READ=2
  -D PIN_BOARD_SDA=0
  -D PIN_BOARD_SCL=1
  -D P_LORA_NSS=8
  -D P_LORA_RESET=11
  -D P_LORA_DIO_1=3
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=6
  -D P_LORA_MOSI=7
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/tiny_lora_mv_zhcn>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6

[env:TinyLora_MV_ZHCN_companion_radio_ble]
extends = TinyLora_MV_ZHCN
build_flags =
  ${TinyLora_MV_ZHCN.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=CJKSSD1306Display
  -D DISPLAY_ADDRESS=0x3C
  -D DISPLAY_ADDRESS_FALLBACK=0x3D
  -D DISPLAY_I2C_CLOCK=400000
  -D PIN_OLED_RESET=-1
  -D UI_HAS_JOYSTICK=1
  -D UI_HAS_PCF8574_JOYSTICK=1
  -D UI_SENSORS_PAGE=1
  -D PCF8574_ADDRESS=0x20
  -D PCF8574_INT_PIN=9
  -D TINYLORA_C3_COMPANION_IDLE_DELAY_MS=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D BLE_ADVERTISING_MIN_INTERVAL=500
  -D BLE_ADVERTISING_MAX_INTERVAL=1000
  -D esp_ble_gap_ext_adv_reprot_t=esp_ble_gap_ext_adv_report_t
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${TinyLora_MV_ZHCN.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${TinyLora_MV_ZHCN.lib_deps}
  https://github.com/ssp97/OLEDDisplayCJK/archive/ab10ff5acd0a0c18ec2d5c3d63c46f4f1eb10608.zip
  ${esp32_ota.lib_deps}

[env:tinylora_mv_zhcn_companion_radio_ble]
extends = TinyLora_MV_ZHCN_companion_radio_ble
